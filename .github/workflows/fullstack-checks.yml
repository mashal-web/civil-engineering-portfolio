name: Full-stack starter checks
on:
  push:
    branches: [main]
    paths: ["src/**", "backend/**", "database/**", "test/**", "package.json", "tsconfig.json", "docker-compose.yml", ".github/workflows/fullstack-checks.yml"]
  pull_request:
    paths: ["src/**", "backend/**", "database/**", "test/**", "package.json", "tsconfig.json", "docker-compose.yml", ".github/workflows/fullstack-checks.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run typecheck
      - run: npm test
  python:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend/python }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=. pytest -q
