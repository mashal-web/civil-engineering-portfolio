name: Deploy static portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required static pages
        run: |
          set -eu
          for file in index.html about.html academics.html courses.html quantitative-reasoning.html projects.html journal.html contact.html styles.css assets/engineering-mark.svg assets/project-bridge.svg assets/beam-load.svg projects/bridge-study.html journal/learning-notes.html; do
            test -s "$file" || { echo "Missing required file: $file"; exit 1; }
          done
          if find . -path './.git' -prune -o -type f -name '*.html' -print0 | xargs -0 grep -nE '<script|<style|@keyframes|transition[[:space:]]*:'; then
            echo "Unexpected script, embedded style, animation or transition found."
            exit 1
          fi
          if grep -nE 'transition[[:space:]]*:|@keyframes' styles.css; then
            echo "CSS animation or transition found."
            exit 1
          fi
      - name: Prepare static website
        run: |
          mkdir -p _site
          cp index.html about.html academics.html courses.html quantitative-reasoning.html projects.html journal.html contact.html styles.css _site/
          cp -R assets projects journal _site/
          cat > _site/404.html <<'EOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Page not found — Mashal Khan</title><link rel="stylesheet" href="styles.css"></head><body><main class="container page-intro"><p class="eyebrow">ERROR / 404</p><h1>This page could not be found.</h1><p class="lede">The link may be outdated or the page may have moved.</p><a class="button button-dark" href="index.html">Return home</a></main></body></html>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
