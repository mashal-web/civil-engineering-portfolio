name: Deploy static portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required static pages
        run: |
          set -eu
          for file in index.html about.html academics.html courses.html quantitative-reasoning.html projects.html journal.html contact.html styles.css assets/engineering-mark.svg assets/project-bridge.svg assets/beam-load.svg projects/bridge-study.html journal/learning-notes.html; do
            test -s "$file" || { echo "Missing required file: $file"; exit 1; }
          done
          if find . -path './.git' -prune -o -type f -name '*.html' -print0 | xargs -0 grep -nE '<script|<style|@keyframes|transition[[:space:]]*:'; then
            echo "Unexpected script, embedded style, animation or transition found."
            exit 1
          fi
          if grep -nE 'transition[[:space:]]*:|@keyframes' styles.css; then
            echo "CSS animation or transition found."
            exit 1
          fi
      - name: Check local links and stylesheet versions
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit, unquote
          import re, sys

          root = Path(".").resolve()
          pages = sorted(root.rglob("*.html"))
          pages = [p for p in pages if ".git" not in p.parts and "_site" not in p.parts]
          errors = []

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.targets = set()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if a.get("id"):
                      self.targets.add(a["id"])
                  if tag == "a" and a.get("name"):
                      self.targets.add(a["name"])
                  for key in ("href", "src"):
                      if a.get(key):
                          self.links.append((key, a[key]))
          
          parsed = {}
          for page in pages:
              parser = PageParser()
              parser.feed(page.read_text(encoding="utf-8"))
              parsed[page.resolve()] = parser
          
          cache_keys = set()
          for page, parser in parsed.items():
              raw = page.read_text(encoding="utf-8")
              for key, url in parser.links:
                  parts = urlsplit(url)
                  if parts.scheme or parts.netloc or url.startswith("//") or parts.path.startswith("/"):
                      continue
                  target_path = (page.parent / unquote(parts.path)).resolve() if parts.path else page
                  if not target_path.exists():
                      errors.append(f"{page.relative_to(root)}: missing {key} target {url}")
                      continue
                  if parts.fragment and target_path.suffix.lower() in (".html", ".htm"):
                      target_parser = parsed.get(target_path)
                      if target_parser and unquote(parts.fragment) not in target_parser.targets:
                          errors.append(f"{page.relative_to(root)}: missing fragment #{parts.fragment} in {target_path.relative_to(root)}")
              m = re.search(r'href=["\'](?:\.\./)?styles\.css\?v=([^"\']+)', raw)
              if m:
                  cache_keys.add(m.group(1))
          if len(cache_keys) > 1:
              errors.append("Inconsistent stylesheet cache keys: " + ", ".join(sorted(cache_keys)))
          if errors:
              print("\n".join("ERROR: " + e for e in errors))
              sys.exit(1)
          print(f"Checked {len(pages)} HTML pages: local links, fragments and stylesheet cache keys passed.")
          PY
      - name: Prepare static website
        run: |
          mkdir -p _site
          cp index.html about.html academics.html courses.html quantitative-reasoning.html projects.html journal.html contact.html styles.css _site/
          cp -R assets projects journal _site/
          cat > _site/404.html <<'EOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Page not found — Mashal Khan</title><link rel="stylesheet" href="styles.css"></head><body><main class="container page-intro"><p class="eyebrow">ERROR / 404</p><h1>This page could not be found.</h1><p class="lede">The link may be outdated or the page may have moved.</p><a class="button button-dark" href="index.html">Return home</a></main></body></html>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
