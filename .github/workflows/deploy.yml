name: Deploy static portfolio to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required static pages
        run: |
          set -eu
          for file in index.html about.html academics.html courses.html quantitative-reasoning.html islamic-studies.html projects.html journal.html contact.html styles.css assets/engineering-mark.svg assets/project-bridge.svg assets/beam-load.svg projects/bridge-study.html projects/beam-study.html journal/learning-notes.html; do
            test -s "$file" || { echo "Missing required file: $file"; exit 1; }
          done
          if find . -path './.git' -prune -o -type f -name '*.html' -print0 | xargs -0 grep -nE '<script|<style|@keyframes|transition[[:space:]]*:'; then
            echo "Unexpected script, embedded style, animation or transition found."
            exit 1
          fi
          if grep -nE 'transition[[:space:]]*:|@keyframes' styles.css; then
            echo "CSS animation or transition found."
            exit 1
          fi
      - name: Check local links and stylesheet versions
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit, unquote
          import re, sys

          root = Path(".").resolve()
          pages = sorted(root.rglob("*.html"))
          pages = [p for p in pages if ".git" not in p.parts and "_site" not in p.parts]
          errors = []

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.targets = set()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if a.get("id"):
                      self.targets.add(a["id"])
                  if tag == "a" and a.get("name"):
                      self.targets.add(a["name"])
                  for key in ("href", "src"):
                      if a.get(key):
                          self.links.append((key, a[key]))
          
          parsed = {}
          for page in pages:
              parser = PageParser()
              parser.feed(page.read_text(encoding="utf-8"))
              parsed[page.resolve()] = parser
          
          cache_keys = set()
          for page, parser in parsed.items():
              raw = page.read_text(encoding="utf-8")
              for key, url in parser.links:
                  parts = urlsplit(url)
                  if parts.scheme or parts.netloc or url.startswith("//") or parts.path.startswith("/"):
                      continue
                  target_path = (page.parent / unquote(parts.path)).resolve() if parts.path else page
                  if not target_path.exists():
                      errors.append(f"{page.relative_to(root)}: missing {key} target {url}")
                      continue
                  if parts.fragment and target_path.suffix.lower() in (".html", ".htm"):
                      target_parser = parsed.get(target_path)
                      if target_parser and unquote(parts.fragment) not in target_parser.targets:
                          errors.append(f"{page.relative_to(root)}: missing fragment #{parts.fragment} in {target_path.relative_to(root)}")
              m = re.search(r'href=["\'](?:\.\./)?styles\.css\?v=([^"\']+)', raw)
              if m:
                  cache_keys.add(m.group(1))
          css_file = root / "styles.css"
          if css_file.exists():
              css = css_file.read_text(encoding="utf-8")
              for asset_url in re.findall(r"url\(\s*['\"]?([^'\")]+)", css):
                  asset_url = asset_url.strip()
                  parts = urlsplit(asset_url)
                  if parts.scheme or parts.netloc or asset_url.startswith("//") or asset_url.startswith("data:"):
                      continue
                  asset_path = (css_file.parent / unquote(parts.path)).resolve()
                  if not asset_path.exists():
                      errors.append(f"styles.css: missing CSS asset {asset_url}")
          if len(cache_keys) > 1:
              errors.append("Inconsistent stylesheet cache keys: " + ", ".join(sorted(cache_keys)))
          if errors:
              print("\n".join("ERROR: " + e for e in errors))
              sys.exit(1)
          print(f"Checked {len(pages)} HTML pages: local links, fragments and stylesheet cache keys passed.")
          PY
      - name: Check accessibility basics and page metadata
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys

          pages = [p for p in Path(".").rglob("*.html") if ".git" not in p.parts and "_site" not in p.parts]
          errors = []

          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.lang = False
                  self.title = False
                  self.description = False
                  self.viewport = False
                  self.ids = set()
                  self.images = 0
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "html" and a.get("lang"):
                      self.lang = True
                  if tag == "title":
                      self.title = True
                  if tag == "meta" and a.get("name", "").lower() == "description" and a.get("content", "").strip():
                      self.description = True
                  if tag == "meta" and a.get("name", "").lower() == "viewport" and a.get("content", "").strip():
                      self.viewport = True
                  if a.get("id"):
                      if a["id"] in self.ids:
                          self.error_duplicate = a["id"]
                      self.ids.add(a["id"])
                  if tag == "img":
                      self.images += 1
                      if "alt" not in a:
                          self.missing_alt = True

          for page in pages:
              audit = Audit()
              audit.missing_alt = False
              audit.error_duplicate = ""
              audit.feed(page.read_text(encoding="utf-8"))
              for ok, label in ((audit.lang, "html lang"), (audit.title, "title"), (audit.description, "meta description"), (audit.viewport, "viewport meta")):
                  if not ok:
                      errors.append(f"{page}: missing {label}")
              if audit.missing_alt:
                  errors.append(f"{page}: img missing alt attribute")
              if audit.error_duplicate:
                  errors.append(f"{page}: duplicate id {audit.error_duplicate}")
          if errors:
              print("\n".join("ERROR: " + e for e in errors))
              sys.exit(1)
          print(f"Accessibility basics and metadata passed for {len(pages)} HTML pages.")
          PY
      - name: Check document structure and navigation
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys

          pages = [p for p in Path(".").rglob("*.html") if ".git" not in p.parts and "_site" not in p.parts]
          errors = []
          seen_titles = {}
          seen_descriptions = {}

          class StructureAudit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.h1 = 0
                  self.main = 0
                  self.primary_nav = 0
                  self.current_page_links = 0
                  self.skip_link = 0
                  self.ids = set()
                  self.duplicate_ids = []
                  self.bad_images = []
                  self.heading_stack = []
                  self.heading_jumps = []
                  self.title = ""
                  self.description = ""
                  self.in_title = False
                  self.in_primary_nav = False
                  self.nav_depth = 0
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "main":
                      self.main += 1
                  if tag == "h1":
                      self.h1 += 1
                  if tag == "nav" and a.get("class") == "primary-nav":
                      self.primary_nav += 1
                      self.in_primary_nav = True
                  if tag == "a" and self.in_primary_nav and a.get("aria-current") == "page":
                      self.current_page_links += 1
                  if tag == "a" and "skip-link" in a.get("class", "").split():
                      self.skip_link += 1
                  if a.get("id"):
                      if a["id"] in self.ids:
                          self.duplicate_ids.append(a["id"])
                      self.ids.add(a["id"])
                  if tag == "img" and not a.get("alt", "").strip():
                      self.bad_images.append(a.get("src", "(unknown source)"))
                  if tag in ("h1", "h2", "h3", "h4", "h5", "h6"):
                      level = int(tag[1])
                      if self.heading_stack and level > self.heading_stack[-1] + 1:
                          self.heading_jumps.append(f"h{self.heading_stack[-1]} to h{level}")
                      self.heading_stack.append(level)
                  if tag == "title":
                      self.in_title = True
                  if tag == "meta" and a.get("name", "").lower() == "description":
                      self.description = a.get("content", "").strip()
              def handle_endtag(self, tag):
                  if tag == "title":
                      self.in_title = False
                  if tag == "nav" and self.in_primary_nav:
                      self.in_primary_nav = False
              def handle_data(self, data):
                  if self.in_title:
                      self.title += data.strip()

          for page in pages:
              audit = StructureAudit()
              audit.feed(page.read_text(encoding="utf-8"))
              label = str(page)
              for condition, message in (
                  (audit.h1 == 1, "must contain exactly one h1"),
                  (audit.main == 1, "must contain exactly one main landmark"),
                  (audit.primary_nav == 1, "must contain exactly one primary navigation"),
                  (audit.current_page_links == 1, "primary navigation must identify exactly one current page"),
                  (audit.skip_link == 1, "must contain exactly one skip link"),
              ):
                  if not condition:
                      errors.append(f"{label}: {message}")
              if audit.duplicate_ids:
                  errors.append(f"{label}: duplicate IDs: {', '.join(audit.duplicate_ids)}")
              if audit.bad_images:
                  errors.append(f"{label}: missing or empty image alt text: {', '.join(audit.bad_images)}")
              if audit.heading_jumps:
                  errors.append(f"{label}: heading hierarchy skips: {', '.join(audit.heading_jumps)}")
              title = " ".join(audit.title.split())
              if not title:
                  errors.append(f"{label}: empty document title")
              elif title in seen_titles:
                  errors.append(f"{label}: duplicate title also used by {seen_titles[title]}")
              else:
                  seen_titles[title] = label
              if not audit.description:
                  errors.append(f"{label}: empty meta description")
              elif audit.description in seen_descriptions:
                  errors.append(f"{label}: duplicate meta description also used by {seen_descriptions[audit.description]}")
              else:
                  seen_descriptions[audit.description] = label

          if errors:
              print("\\n".join("ERROR: " + e for e in errors))
              sys.exit(1)
          print(f"Document structure, headings, navigation and unique metadata passed for {len(pages)} HTML pages.")
          PY
      - name: Prepare static website
        run: |
          mkdir -p _site
          cp index.html about.html academics.html courses.html quantitative-reasoning.html islamic-studies.html projects.html journal.html contact.html styles.css _site/
          cp -R assets projects journal _site/
          cat > _site/404.html <<'EOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Page not found — Mashal Khan</title><meta name="description" content="The requested page could not be found in Mashal Khan’s civil engineering portfolio."><link rel="stylesheet" href="styles.css"></head><body><main class="container page-intro"><p class="eyebrow">ERROR / 404</p><h1>This page could not be found.</h1><p class="lede">The link may be outdated or the page may have moved.</p><a class="button button-dark" href="index.html">Return home</a></main></body></html>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
