name: Deploy static portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript and portfolio hooks
        run: node --check script.js && node tests/smoke.cjs
      - name: Prepare static website
        run: |
          mkdir -p _site
          cp index.html about.html academics.html courses.html projects.html journal.html contact.html styles.css script.js _site/
          mkdir -p _site/assets
          cp assets/engineering-mark.svg _site/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
